# ==============================================================================
# JokerArena Frontend Web Server & API Reverse Proxy Configuration
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Gzip compression for high-performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Root directory for compiled SPA assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # 1. Static Assets Caching (Vite hashed bundles)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ensure index.html is never cached by browsers
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # --------------------------------------------------------------------------
    # 2. SPA Client-Side Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 3. Game Engine REST API Reverse Proxy (Connector C1)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://jokerarena-game-ms:8080/api/;
        proxy_http_version 1.1;

        # Standard client forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for REST requests
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. Game Engine WebSocket Reverse Proxy (Connector C2)
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://jokerarena-game-ms:8080/ws/;
        proxy_http_version 1.1;

        # WebSocket handshake upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived persistent connection timeout (1 hour)
        # Prevents premature disconnection during turns or idle deliberation
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 5. Telemetry REST & SSE Streaming Reverse Proxy (Connectors C3 & C4)
    # --------------------------------------------------------------------------
    location /telemetry/ {
        proxy_pass http://jokerarena-telemetry-ms:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to allow immediate real-time SSE packet flushing
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 6. Basic Healthcheck Endpoint
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }
}
